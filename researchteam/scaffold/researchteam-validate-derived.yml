name: ResearchTeam Validate

# Runs the bridge validator on pull requests and on pushes to main: fence pairing and placeholders, this
# repository's own checks in scripts/validate.d/, and the term-index gate when the scholarly scripts are
# present (docs/term-index-protocol.md). Without this workflow those checks depend on someone running
# `bash scripts/claude_researchteam_bridge.sh validate` by hand.
#
# Read-only: no secrets, no write token, no artifacts. It runs the scripts of the commit under test, as
# any test workflow does.
#
# OPT-IN: written only by `researchteam workflow-sync --workflow validate`, which keeps the `on:` block
# below as this repository has it. `researchteam init` does not install it and `researchteam update`
# never touches it. A workflow change gets this repository's own @security review.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: researchteam-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Bridge validate
        run: bash scripts/claude_researchteam_bridge.sh validate
