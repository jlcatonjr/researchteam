name: ResearchTeam + AgentTeams Autosync (SHA-gated evergreen PR)

# Automatically integrate agentteams (layer-1) + researchteam-managed (layer-2) updates into this
# derived repo. The logic lives in scripts/agentteams_autosync_gate.sh — a researchteam-MANAGED file
# that arrives via `researchteam update`, so this workflow stays a thin shell and fixes propagate
# from upstream. Auto-PR ONLY: a real agentteams update opens/updates ONE evergreen PR
# (chore/agentteams-autosync) that a human reviews and merges. `--mode derived` runs the full
# `researchteam update` (layer-2 managed-file sync + layer-1 agentteams merge).
#
# Note: the SHA-gate keys on the agentteams commit (the stated primary trigger); an agentteams-driven
# fire also pulls any pending layer-2 managed changes. A researchteam-managed-only change is not yet an
# independent trigger — run this workflow with force=true to pull one on demand. See
# docs/agentteams-update-policy.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force integration even if the recorded agentteams SHA is unchanged"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC — SHA-gated, so a no-change week does nothing

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentteams-autosync
  cancel-in-progress: false

jobs:
  autosync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the SHA-gate baseline)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Release trust root (release-locked repos; operator-provisioned secret)
        env:
          ALLOWED_SIGNERS: ${{ secrets.AGENTTEAMS_ALLOWED_SIGNERS }}
        run: |
          # A release-locked toolchain.lock verifies signed tags against allowed_signers. The runner has
          # none, so the operator stores the line from agentteams SECURITY.md "Release signers" as this
          # secret. Without it, release-locked runs fail closed; unlocked runs never read it.
          # Only the agentteams release key is trusted here, by its pinned fingerprint (SECURITY.md "Release
          # signers"): a secret holding another key, or more than that one line, would let that key's tags
          # verify as releases. A key rotation is a reviewed change to RELEASE_FP, never a secret edit.
          if [ -n "$ALLOWED_SIGNERS" ]; then
            RELEASE_FP="SHA256:IPdnLwlFdHNhr7QGKVWU40BOKyYzv2u8qxP/qxnzTNM"
            signers="$RUNNER_TEMP/allowed_signers"
            printf '%s\n' "$ALLOWED_SIGNERS" | sed '/^[[:space:]]*$/d' > "$signers"
            if [ "$(wc -l < "$signers" | tr -d ' ')" != 1 ]; then
              echo "AGENTTEAMS_ALLOWED_SIGNERS must hold exactly one line, the release key's; refusing" >&2; exit 1
            fi
            read -r principal opts ktype kdata rest < "$signers"
            if [ -z "$principal" ] || [ "$opts" != 'namespaces="git"' ] || [ -z "$kdata" ] || [ -n "$rest" ]; then
              echo 'AGENTTEAMS_ALLOWED_SIGNERS is not "<principal> namespaces="git" <type> <key>"; refusing' >&2; exit 1
            fi
            printf '%s %s\n' "$ktype" "$kdata" > "$signers.pub"
            fp="$(ssh-keygen -l -E sha256 -f "$signers.pub" 2>/dev/null | awk '{print $2}')"
            if [ "$fp" != "$RELEASE_FP" ]; then
              echo "AGENTTEAMS_ALLOWED_SIGNERS holds key ${fp:-<unreadable>}, not the release key $RELEASE_FP; refusing" >&2
              exit 1
            fi
            echo "AGENTTEAMS_ALLOWED_SIGNERS=$signers" >> "$GITHUB_ENV"
          fi

      - name: Install ResearchTeam CLI
        run: |
          python -m pip install --upgrade pip
          # A release-locked repo (toolchain.lock has `researchteam.tag=`) installs researchteam at the
          # lock's PR-reviewed commit, so the code that verifies release tags in the gate below is the
          # pinned release, not whatever is on researchteam main (release policy §3). The gate re-verifies
          # that commit against the signed tag. An unlocked repo keeps the latest main, as before.
          RT_GIT="${RESEARCHTEAM_GIT:-https://github.com/jlcatonjr/researchteam.git}"
          RT_REF=""
          if [ -f toolchain.lock ] && grep -qE '^researchteam\.tag=' toolchain.lock; then
            pin="$(grep -E '^researchteam=' toolchain.lock | head -1 | cut -d= -f2-)"
            tag="$(grep -E '^researchteam\.tag=' toolchain.lock | head -1 | cut -d= -f2-)"
            sha="${pin#jlcatonjr/researchteam@}"
            if [ "$sha" = "$pin" ] || ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "toolchain.lock is release-locked but researchteam= is not jlcatonjr/researchteam@<40-hex sha>: '$pin'" >&2
              exit 1
            fi
            if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "toolchain.lock is release-locked but researchteam.tag is not a release tag: '$tag'" >&2
              exit 1
            fi
            if [ -z "${AGENTTEAMS_ALLOWED_SIGNERS:-}" ] || [ ! -s "$AGENTTEAMS_ALLOWED_SIGNERS" ]; then
              echo "release-locked: no allowed_signers (set the AGENTTEAMS_ALLOWED_SIGNERS secret); refusing" >&2
              exit 1
            fi
            # Verify with the runner's own git, BEFORE installing anything: the tag must exist in
            # researchteam's own refs (not merely a commit reachable in its fork network), be an annotated
            # tag signed by a release key in allowed_signers, and peel to the locked commit. The gate's
            # later re-check runs the installed code, so this is the independent one.
            vdir="$(mktemp -d)"
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1  # neutralised config
            git init -q --bare "$vdir/rt.git"
            git -C "$vdir/rt.git" fetch -q --no-tags "$RT_GIT" "refs/tags/$tag:refs/tags/$tag" || {
              echo "release-locked: tag $tag not found in $RT_GIT" >&2; exit 1; }
            if [ "$(git -C "$vdir/rt.git" cat-file -t "refs/tags/$tag")" != "tag" ]; then
              echo "release-locked: $tag is not an annotated tag" >&2; exit 1
            fi
            git -C "$vdir/rt.git" -c gpg.ssh.allowedSignersFile="$AGENTTEAMS_ALLOWED_SIGNERS" tag -v "$tag" >/dev/null 2>&1 || {
              echo "release-locked: $tag does not verify against allowed_signers" >&2; exit 1; }
            peeled="$(git -C "$vdir/rt.git" rev-parse "refs/tags/$tag^{commit}")"
            if [ "$peeled" != "$sha" ]; then
              echo "release-locked: $tag peels to $peeled, but the lock pins $sha" >&2; exit 1
            fi
            rm -rf "$vdir"
            unset GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM
            RT_REF="@$sha"
            echo "release-locked: $tag verified (peeled $sha); installing researchteam at that commit"
          fi
          python -m pip install "git+${RT_GIT}${RT_REF}"
          researchteam --version

      - name: Fetch evergreen branch (SHA-gate baseline while a PR is open)
        run: git fetch origin "chore/agentteams-autosync" || true

      - name: Autosync gate — SHA-gate → pinned install → full update → BLOCKING gates
        id: gate
        env:
          AUTOSYNC_PR_BODY_FILE: ${{ runner.temp }}/autosync-pr-body.md
        run: |
          # If the managed gate script has not synced into this repo yet, do a one-time layer-2 sync
          # to fetch it, then run it.
          if [ ! -f scripts/agentteams_autosync_gate.sh ]; then
            researchteam update --layer2-only --yes || true
          fi
          if [ ! -f scripts/agentteams_autosync_gate.sh ]; then
            echo "autosync gate script absent even after layer-2 sync — skipping (run: researchteam update)."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          bash scripts/agentteams_autosync_gate.sh --mode derived $FORCE_FLAG

      - name: Read PR body
        if: steps.gate.outputs.changed == 'true'
        id: prbody
        run: |
          { echo "text<<PRBODY_EOF"; cat "${{ runner.temp }}/autosync-pr-body.md"; echo "PRBODY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Open / update the evergreen auto-PR (never auto-merge)
        if: steps.gate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          branch: chore/agentteams-autosync
          delete-branch: false
          title: "chore: researchteam + agentteams autosync → ${{ steps.gate.outputs.new_sha }}"
          commit-message: "chore: researchteam + agentteams autosync → ${{ steps.gate.outputs.new_sha }}"
          body: ${{ steps.prbody.outputs.text }}
          # security-review-required: the gate found a security-boundary path (sandbox/, hooks, CI,
          # scripts, agent capability files, ...) in this update. Do not merge without @security.
          labels: agentteams-autosync${{ steps.gate.outputs.sensitive == 'true' && ',security-review-required' || '' }}
