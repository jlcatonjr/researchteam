name: ResearchTeam + AgentTeams Autosync (SHA-gated evergreen PR)

# Automatically integrate agentteams (layer-1) + researchteam-managed (layer-2) updates into this
# derived repo. The logic lives in scripts/agentteams_autosync_gate.sh — a researchteam-MANAGED file
# that arrives via `researchteam update`, so this workflow stays a thin shell and fixes propagate
# from upstream. Auto-PR ONLY: a real agentteams update opens/updates ONE evergreen PR
# (chore/agentteams-autosync) that a human reviews and merges. `--mode derived` runs the full
# `researchteam update` (layer-2 managed-file sync + layer-1 agentteams merge).
#
# Note: the SHA-gate keys on the agentteams commit (the stated primary trigger); an agentteams-driven
# fire also pulls any pending layer-2 managed changes. A researchteam-managed-only change is not yet an
# independent trigger — run this workflow with force=true to pull one on demand. See
# docs/agentteams-update-policy.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force integration even if the recorded agentteams SHA is unchanged"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC — SHA-gated, so a no-change week does nothing

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentteams-autosync
  cancel-in-progress: false

jobs:
  autosync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the SHA-gate baseline)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ResearchTeam CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/jlcatonjr/researchteam.git"
          researchteam --version

      - name: Fetch evergreen branch (SHA-gate baseline while a PR is open)
        run: git fetch origin "chore/agentteams-autosync" || true

      - name: Autosync gate — SHA-gate → pinned install → full update → BLOCKING gates
        id: gate
        env:
          AUTOSYNC_PR_BODY_FILE: ${{ runner.temp }}/autosync-pr-body.md
        run: |
          # If the managed gate script has not synced into this repo yet, do a one-time layer-2 sync
          # to fetch it, then run it.
          if [ ! -f scripts/agentteams_autosync_gate.sh ]; then
            researchteam update --layer2-only --yes || true
          fi
          if [ ! -f scripts/agentteams_autosync_gate.sh ]; then
            echo "autosync gate script absent even after layer-2 sync — skipping (run: researchteam update)."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          bash scripts/agentteams_autosync_gate.sh --mode derived $FORCE_FLAG

      - name: Read PR body
        if: steps.gate.outputs.changed == 'true'
        id: prbody
        run: |
          { echo "text<<PRBODY_EOF"; cat "${{ runner.temp }}/autosync-pr-body.md"; echo "PRBODY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Open / update the evergreen auto-PR (never auto-merge)
        if: steps.gate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/agentteams-autosync
          delete-branch: false
          title: "chore: researchteam + agentteams autosync → ${{ steps.gate.outputs.new_sha }}"
          commit-message: "chore: researchteam + agentteams autosync → ${{ steps.gate.outputs.new_sha }}"
          body: ${{ steps.prbody.outputs.text }}
          labels: agentteams-autosync
