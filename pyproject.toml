[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchteam"
version = "0.1.0"
description = "Agent-based research workflow framework with auto-updating infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Base install stays dependency-free so `pip install researchteam` (and the
# `pip install git+https://github.com/jlcatonjr/researchteam.git` quick-start) always
# resolves. `agentteams` is NOT on PyPI, so it must never be a hard dependency.
dependencies = []

# Layer-1 (`researchteam update`'s agent-team regeneration) needs `agentteams`. It is an
# OPTIONAL extra installed from git, never a PyPI floor. Prefer an editable install from a
# stable local checkout for development:  pip install -e /path/to/agentteams
# `researchteam doctor` / the update preflight verify it is present and runnable at runtime.
[project.optional-dependencies]
update = ["agentteams @ git+https://github.com/jlcatonjr/agentteams"]
# `agentteams.research` (web search, curated-source rating, dual-lens claim verification) — the
# real, generalized implementation the on-the-fly-retrieval-profile.md / citation-claim-audit-
# protocol.md docs describe. TEMPORARILY branch-pinned (not `main`-pinned like `update` above):
# the capability lands on agentteams' `feat/research-fact-verification-baseline` branch, not yet
# merged to its `main`, as of this writing — an unpinned `agentteams @ git+...` URL would silently
# resolve to `main` and install code with no `research/` subpackage at all. TODO once that branch
# merges: re-pin to bare `agentteams @ git+https://github.com/jlcatonjr/agentteams` (matching
# `update`'s own shape) and drop the branch ref.
research = ["agentteams[research] @ git+https://github.com/jlcatonjr/agentteams@feat/research-fact-verification-baseline"]

[project.scripts]
researchteam = "researchteam.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["researchteam*"]

[tool.setuptools.package-data]
researchteam = ["scaffold/*"]
