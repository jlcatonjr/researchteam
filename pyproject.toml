[build-system]
# The version comes from git tags (setuptools-scm). Build requirements are exact pins vetted for S-10 on
# 2026-10-16 (docs/release/build-requirements-2026-10-16.md): no OSV advisories, all >= 14 days old.
requires = ["setuptools==84.0.0", "setuptools-scm==10.3.4", "vcs-versioning==2.5.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "researchteam"
dynamic = ["version"]
description = "Agent-based research workflow framework with auto-updating infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Base install stays dependency-free so `pip install researchteam` (and the
# `pip install git+https://github.com/jlcatonjr/researchteam.git` quick-start) always
# resolves. `agentteams` is NOT on PyPI, so it must never be a hard dependency.
dependencies = []

# Layer-1 (`researchteam update`'s agent-team regeneration) needs `agentteams`. It is an
# OPTIONAL extra installed from git, never a PyPI floor. Prefer an editable install from a
# stable local checkout for development:  pip install -e /path/to/agentteams
# Both extras pin the peeled commit of a verified signed agentteams tag (release policy §3), the same
# commit as toolchain.lock; scripts/check_toolchain.py reports any disagreement. Now: v1.0.0-rc.11.
# `researchteam doctor` / the update preflight verify it is present and runnable at runtime.
[project.optional-dependencies]
update = ["agentteams @ git+https://github.com/jlcatonjr/agentteams@ee09a0379a76bdc66a4d24f065cec7883ea53281"]
# `agentteams.research` (web search, curated-source rating, dual-lens claim verification) — the
# real, generalized implementation the on-the-fly-retrieval-profile.md / citation-claim-audit-
# protocol.md docs describe. Pinned exactly like `update`.
research = ["agentteams[research] @ git+https://github.com/jlcatonjr/agentteams@ee09a0379a76bdc66a4d24f065cec7883ea53281"]

[project.scripts]
researchteam = "researchteam.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["researchteam*"]

[tool.setuptools.package-data]
researchteam = ["scaffold/*"]

[tool.setuptools_scm]
# Only release tags (vX.Y.Z, vX.Y.Z-rc.N) count: backup/* and pre-* safety tags must never become a version.
# v1.0.0-rc.1 -> 1.0.0rc1. Between tags: the next version as a .devN with the commit (guess-next-dev).
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:-rc\\.\\d+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
# A GitHub source archive has no .git; .git_archival.txt (export-subst) carries the ref instead.
fallback_version = "0.0.0+unknown"
