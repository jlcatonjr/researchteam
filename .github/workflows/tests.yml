name: Tests

# Runs researchteam's test suite and the bridge validator on every push and pull request to main and to
# release branches. Read-only: no secrets, no write token, no artifacts. Added for the v1.0.0 release line,
# which had no CI test run (operator decision, 2026-10-17).

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # oldest supported (requires-python >=3.10) and newest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Test-only dependencies, exact versions and hashes (.github/ci/requirements-test.txt, vetted under
      # S-10). researchteam itself has none; agentteams is not installed, so the one test that needs it is
      # skipped (tests use fakes for every agentteams call).
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r .github/ci/requirements-test.txt

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Bridge validate (fence pairing, placeholders)
        run: bash scripts/claude_researchteam_bridge.sh validate
