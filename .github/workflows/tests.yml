name: Tests

# Runs researchteam's test suite and the bridge validator on every push and pull request to main and to
# release branches. Read-only: no secrets, no write token, no artifacts. Added for the v1.0.0 release line,
# which had no CI test run (operator decision, 2026-10-17).

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # oldest supported (requires-python >=3.10) and newest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Test-only dependencies, exact versions and hashes (.github/ci/requirements-test.txt, vetted under
      # S-10). researchteam itself has none; agentteams is not installed, so the one test that needs it is
      # skipped (tests use fakes for every agentteams call).
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r .github/ci/requirements-test.txt

      # Graphviz and Node, so the concept-map layout tests and the component test run instead of skipping
      # (operator decision, 2026-11-23). Graphviz comes from the runner's own Ubuntu archive; Node is the one
      # the runner image ships, so no action and no download from elsewhere is added. The step fails when
      # either is missing: a skipped test must not pass for a run one.
      # S-10 record (2026-11-23): on the runner image ubuntu-26.04 the step installed graphviz 14.1.2-1ubuntu1
      # and its own libraries at the same version (libcdt6, libcgraph8, libgvc7, libgvpr2, libpathplan4,
      # libxdot4, libgvplugin-gd8, libgvplugin-pango8); Node was the image's v24.22.3. OSV, queried for
      # graphviz in Ubuntu:26.04:LTS at that version, lists one advisory: CVE-2019-9904 (Ubuntu priority low,
      # no fix released): deep recursion on a crafted graph can exhaust the stack and end the process. Here
      # `dot` reads only DOT text the repository's own exporter writes, on a runner with no secrets, so the
      # worst case is a failed job. An apt package cannot be pinned to an exact version, so this record is
      # renewed whenever the step is changed or the runner's Ubuntu release moves.
      - name: Install Graphviz; check Node
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends graphviz
          dot -V
          node --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q -rs tests

      - name: Bridge validate (fence pairing, placeholders)
        run: bash scripts/claude_researchteam_bridge.sh validate

  # The survey toolkit's sign-off tests with agentteams installed (operator decision, 2026-11-25). In the `tests`
  # job agentteams is absent, so every test in which a gate reads CLEARED is skipped there. This job installs
  # agentteams at the commit toolchain.lock pins, with its signing backend, and fails if any of these tests is
  # skipped. Read-only like the job above: no secrets, no write token, no artifacts. Python 3.13 only:
  # agentteams 1.3 needs 3.11 or later.
  survey-signoff:
    name: survey sign-off (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      # Exact versions and hashes for pytest and for everything agentteams imports
      # (.github/ci/requirements-test.txt and requirements-agentteams.txt, vetted under S-10).
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r .github/ci/requirements-test.txt
          python -m pip install --require-hashes --only-binary :all: -r .github/ci/requirements-agentteams.txt

      # agentteams itself, from the one upstream repository at the full commit toolchain.lock pins: a git
      # commit id fixes the content, so no hash file is needed. --no-deps: nothing else is resolved or
      # downloaded; --no-build-isolation: the build uses the hash-locked setuptools installed above.
      - name: Install agentteams at the pinned commit
        run: |
          pin="$(grep -E '^agentteams=' toolchain.lock | head -1 | cut -d= -f2-)"
          case "$pin" in
            jlcatonjr/agentteams@*) ;;
            *) echo "toolchain.lock agentteams= must be jlcatonjr/agentteams@<sha>, got '$pin'" >&2; exit 1 ;;
          esac
          sha="${pin#*@}"
          printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}' || { echo "the agentteams pin is not a full commit id" >&2; exit 1; }
          python -m pip install --no-deps --no-build-isolation "agentteams @ git+https://github.com/jlcatonjr/agentteams@${sha}"
          python -m pip check
          python -I -c 'import agentteams, cryptography; print("agentteams", agentteams.__version__, "cryptography", cryptography.__version__)'

      # Fail when a test is skipped: here a skip would mean the CLEARED path did not run after all.
      - name: Run the sign-off tests; none may be skipped
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -rs tests/test_survey_verify.py tests/test_survey_gates.py | tee "$RUNNER_TEMP/signoff.txt"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Eq '(^SKIPPED| skipped)' "$RUNNER_TEMP/signoff.txt"; then
            echo "a sign-off test was skipped" >&2; exit 1
          fi
