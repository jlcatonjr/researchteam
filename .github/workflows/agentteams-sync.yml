name: AgentTeams Autosync (SHA-gated evergreen PR)

# Automatically integrate agentteams updates. The heavy lifting — SHA-gate, pinned install, regen,
# churn-scrub, blocking gates, PR body — lives in scripts/agentteams_autosync_gate.sh (a managed file
# that also ships to derived repos), so this workflow adds only the two-job handover (#182):
# the gate job packages its result, and the open_pr job checks it and opens the PR. Auto-PR ONLY: a real agentteams
# update opens/updates ONE evergreen PR (chore/agentteams-autosync) that a human reviews and merges.
# Policy: docs/agentteams-update-policy.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force integration even if the recorded agentteams SHA is unchanged"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC — SHA-gated, so a no-change week does nothing

# No workflow-wide grant: each job states the least it needs (#179).
permissions: {}

concurrency:
  group: agentteams-autosync
  cancel-in-progress: false

jobs:
  # The gate trusts the evergreen branch's ref only while an open PR has that branch as its head (#172). The
  # lookup runs in its own job with a read-only token (#179), so the gate step, which runs the integrated code,
  # never holds a token. A failed lookup leaves `open` empty: the gate treats that as unknown and uses the
  # current branch's ref.
  evergreen_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      open: ${{ steps.evergreen.outputs.open }}
    steps:
      - name: Is the evergreen PR open?
        id: evergreen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if n="$(gh pr list --head chore/agentteams-autosync --state open --json number --jq 'length')"; then
            # Only a count is an answer; anything else leaves `open` empty (unknown), as the gate does.
            case "$n" in
              0) echo "open=false" >> "$GITHUB_OUTPUT" ;;
              ''|*[!0-9]*) echo "::warning::unexpected PR count '$n'; the gate will use the current branch's ref" ;;
              *) echo "open=true" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "::warning::could not list open PRs for chore/agentteams-autosync; the gate will use the current branch's ref"
          fi

  autosync:
    needs: evergreen_pr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Read only (#182): this job runs integrated code, so it cannot push or open a PR. The open_pr job does that.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
      new_sha: ${{ steps.gate.outputs.new_sha }}
      sensitive: ${{ steps.gate.outputs.sensitive }}
    steps:
      # fetch-depth 0 fetches every branch, so origin/chore/agentteams-autosync (the SHA-gate baseline) is here.
      # persist-credentials false: the read token is not left in .git/config while the gate runs integrated
      # code (#179).
      - name: Checkout (full history for the SHA-gate baseline)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install ResearchTeam CLI
        run: |
          # pip itself is held to S-10: an unpinned self-upgrade takes whatever release is newest, even one inside the
          # 14-day cooldown. 26.2.2 is the pin scripts/bootstrap_toolchain.sh uses (OSV none; re-checked 2026-11-12).
          python -m pip install "pip==26.2.2"
          # Install the commit being synced, not main: a dispatch on release/1.0 must test the release's
          # code, and a VCS install records the commit that --write-lock needs.
          python -m pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
          researchteam --version

      - name: Release trust root (release-locked repos; operator-provisioned secret)
        env:
          ALLOWED_SIGNERS: ${{ secrets.AGENTTEAMS_ALLOWED_SIGNERS }}
        run: |
          # A release-locked toolchain.lock verifies signed tags against allowed_signers. The runner has
          # none, so the operator stores the line from agentteams SECURITY.md "Release signers" as this
          # secret. Without it, release-locked runs fail closed; unlocked runs never read it.
          # Only the agentteams release key is trusted here, by its pinned fingerprint (SECURITY.md "Release
          # signers"): a secret holding another key, or more than that one line, would let that key's tags
          # verify as releases. A key rotation is a reviewed change to RELEASE_FP, never a secret edit.
          if [ -n "$ALLOWED_SIGNERS" ]; then
            RELEASE_FP="SHA256:IPdnLwlFdHNhr7QGKVWU40BOKyYzv2u8qxP/qxnzTNM"
            signers="$RUNNER_TEMP/allowed_signers"
            printf '%s\n' "$ALLOWED_SIGNERS" | sed '/^[[:space:]]*$/d' > "$signers"
            if [ "$(wc -l < "$signers" | tr -d ' ')" != 1 ]; then
              echo "AGENTTEAMS_ALLOWED_SIGNERS must hold exactly one line, the release key's; refusing" >&2; exit 1
            fi
            read -r principal opts ktype kdata rest < "$signers"
            if [ -z "$principal" ] || [ "$opts" != 'namespaces="git"' ] || [ -z "$kdata" ] || [ -n "$rest" ]; then
              echo 'AGENTTEAMS_ALLOWED_SIGNERS is not "<principal> namespaces="git" <type> <key>"; refusing' >&2; exit 1
            fi
            printf '%s %s\n' "$ktype" "$kdata" > "$signers.pub"
            fp="$(ssh-keygen -l -E sha256 -f "$signers.pub" 2>/dev/null | awk '{print $2}')"
            if [ "$fp" != "$RELEASE_FP" ]; then
              echo "AGENTTEAMS_ALLOWED_SIGNERS holds key ${fp:-<unreadable>}, not the release key $RELEASE_FP; refusing" >&2
              exit 1
            fi
            echo "AGENTTEAMS_ALLOWED_SIGNERS=$signers" >> "$GITHUB_ENV"
          fi

      - name: Autosync gate — SHA-gate → pinned install → regen → BLOCKING gates
        id: gate
        env:
          AUTOSYNC_PR_BODY_FILE: ${{ runner.temp }}/autosync-pr-body.md
          AUTOSYNC_EVERGREEN_PR_OPEN: ${{ needs.evergreen_pr.outputs.open }}
          # Through env, not written into the script: no expression is expanded inside a shell line (#205).
          EVENT_NAME: ${{ github.event_name }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_INPUT" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          bash scripts/agentteams_autosync_gate.sh --mode upstream $FORCE_FLAG

      # #182: this job runs integrated code, so it holds no write token and opens no PR. It hands the result to
      # the open_pr job as data: one patch and the PR body. Git's global and system config are ignored and the
      # diff options are spelled out, so a config value the integrated code set cannot reshape the patch.
      - name: Package the proposed change (patch + PR body)
        if: steps.gate.outputs.changed == 'true'
        env:
          BODY: ${{ runner.temp }}/autosync-pr-body.md
          OUT: ${{ runner.temp }}/autosync-change
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          rm -rf "$OUT"; mkdir -p "$OUT"
          git add -A
          git diff --cached --binary --full-index --no-color --no-ext-diff --no-textconv --no-relative \
            --src-prefix=a/ --dst-prefix=b/ --ignore-submodules=none HEAD > "$OUT/change.patch"
          cp "$BODY" "$OUT/pr-body.md"

      - name: Upload the proposed change
        if: steps.gate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: autosync-change
          path: ${{ runner.temp }}/autosync-change
          if-no-files-found: error
          retention-days: 3   # "Re-run failed jobs" on open_pr needs the artifact; after 3 days, run the workflow again

  # #182: the only job with a write token. It runs no integrated code: a fresh checkout, the gate job's
  # artifact, one check-and-apply step, then the PR. Everything that comes from the gate job is data.
  open_pr:
    needs: autosync
    # Explicit, because the default `success()` would skip this job whenever evergreen_pr failed.
    if: ${{ !cancelled() && needs.autosync.result == 'success' && needs.autosync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No cache is restored in this job (no actions/cache, no setup-* cache): the gate job can write caches.
      # No `ref:` here. The default checks out the run's branch at the run's commit; naming the commit would
      # leave a detached HEAD, which create-pull-request refuses. The check step confirms the commit.
      - name: Checkout (the branch the gate ran on, at the same commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the proposed change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: autosync-change
          path: ${{ runner.temp }}/autosync-change

      - name: Check and apply the proposed change
        id: change
        env:
          NEW_SHA: ${{ needs.autosync.outputs.new_sha }}
          GATE_SENSITIVE: ${{ needs.autosync.outputs.sensitive }}
          CHANGE_DIR: ${{ runner.temp }}/autosync-change
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::autosync open_pr: $1"; exit 1; }
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          # A whole-string match: a line-based grep would pass a value with a second line, which could set an output.
          [[ "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "new_sha is not a full commit id (40 hex characters)"
          case "$GATE_SENSITIVE" in true|false) ;; *) fail "sensitive is neither true nor false" ;; esac
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ] || fail "the checkout is not the commit the gate ran on"
          git symbolic-ref -q HEAD >/dev/null || fail "the checkout is not on a branch, so no PR can be opened from it"
          patch="$CHANGE_DIR/change.patch"; body="$CHANGE_DIR/pr-body.md"
          for f in "$patch" "$body"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then fail "the artifact lacks a regular file: ${f##*/}"; fi
          done
          if [ "$(find "$CHANGE_DIR" -mindepth 1 | wc -l | tr -d ' ')" != 2 ]; then
            fail "the artifact holds more than the patch and the PR body"
          fi
          # This repository's committed gate script, copied before the patch can change it. Its
          # --classify-sensitive mode reads paths and writes nothing.
          rule="$RUNNER_TEMP/autosync-gate-committed.sh"; rm -f "$rule"
          if [ -f scripts/agentteams_autosync_gate.sh ] && [ ! -L scripts/agentteams_autosync_gate.sh ]; then
            cp scripts/agentteams_autosync_gate.sh "$rule"
          fi
          if [ -s "$patch" ]; then
            git apply --index --whitespace=nowarn "$patch" || fail "the patch does not apply to the checkout"
          fi
          # Each listing goes to a file first, so a git failure stops the step here and cannot pass as "no match".
          listing="$RUNNER_TEMP/autosync-staged"
          git diff --cached --name-only -z HEAD > "$listing.names"
          git diff --cached --raw HEAD > "$listing.raw"
          git diff --cached HEAD -- ':(glob)**/.gitattributes' > "$listing.attributes"
          # Backstops: git apply already refuses .git paths and writes through symbolic links.
          if grep -ziE '(^|/)\.git(/|$)' "$listing.names" >/dev/null; then
            fail "the patch touches a .git path"
          fi
          if awk '$2 == "120000" || $2 == "160000" { hit = 1 } END { exit !hit }' "$listing.raw"; then
            fail "the patch adds a symbolic link or a submodule entry, or turns a file into one"
          fi
          if grep -E '^\+.*filter=' "$listing.attributes" >/dev/null; then
            fail "the patch adds a filter in .gitattributes"
          fi
          # The label is decided here, from the staged paths; the gate job's own answer can only add to it.
          # The names come from the NUL-separated listing: git never quotes those, so a name with a quote or
          # a backslash in it still starts with its real directory.
          staged="$(tr '\0' '\n' < "$listing.names")"
          sensitive="$GATE_SENSITIVE"; found=""
          if [ -f "$rule" ] && grep -q -- '--classify-sensitive)' "$rule"; then
            found="$(printf '%s\n' "$staged" | bash "$rule" --classify-sensitive)" \
              || fail "the committed gate script could not classify the changed paths"
          else
            sensitive=true
            found="(the committed gate script cannot classify paths, so every change is treated as sensitive)"
          fi
          if printf '%s\n' "$staged" | grep -x 'toolchain.lock' >/dev/null; then
            # The pinned repository and the release tag decide what code later runs install.
            lock_id() { { grep -E '^(researchteam|agentteams)(\.tag)?=' || true; } | sed 's/@.*//' | sort; }
            before="$(git show HEAD:toolchain.lock 2>/dev/null | lock_id)"
            after="$( { cat toolchain.lock 2>/dev/null || true; } | lock_id)"
            if [ "$before" != "$after" ]; then
              found="$(printf '%s\n%s\n' "$found" "toolchain.lock (pinned repository or release tag changed)" | sed '/^$/d')"
            fi
          fi
          # A name with a line break in it splits into two lines above, and a rule that matches the end of a
          # name could then miss it. No update needs such a name, so it is treated as sensitive.
          if [ "$(tr -cd '\0' < "$listing.names" | wc -c | tr -d ' ')" != "$(tr '\0' '\n' < "$listing.names" | wc -l | tr -d ' ')" ]; then
            found="$(printf '%s\n%s\n' "$found" "(a changed path has a line break in its name)" | sed '/^$/d')"
          fi
          if [ -n "$found" ]; then sensitive=true; fi
          final="$RUNNER_TEMP/autosync-pr-body-final.md"
          {
            if [ "$sensitive" = true ]; then
              echo "> [!WARNING]"
              echo "> **Security-boundary paths changed: \`@security\` review required before merge.** Found by the job that opens this PR:"
              if [ -n "$found" ]; then printf '%s\n' "$found" | sed -n '1,200s/^/> - /p'; else echo "> - (reported by the gate job)"; fi
              echo
            fi
            echo "_The job that opened this PR ran no integrated code. It applied the gate job's patch to a fresh checkout of \`$EXPECTED_HEAD\` and classified the changed paths itself. The gate job wrote the text below._"
            echo
            head -c 50000 "$body"
            if [ "$(wc -c < "$body" | tr -d ' ')" -gt 50000 ]; then printf '\n\n_(The gate job'"'"'s text is cut at 50,000 bytes.)_\n'; fi
          } > "$final"
          { echo "new_sha=$NEW_SHA"; echo "sensitive=$sensitive"; echo "body=$final"; } >> "$GITHUB_OUTPUT"

      - name: Open / update the evergreen auto-PR (never auto-merge)
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          branch: chore/agentteams-autosync
          delete-branch: false
          title: "chore: agentteams autosync → ${{ steps.change.outputs.new_sha }}"
          commit-message: "chore: agentteams autosync → ${{ steps.change.outputs.new_sha }}"
          # By path: the body never passes through $GITHUB_OUTPUT, so its text cannot set another output.
          body-path: ${{ steps.change.outputs.body }}
          # security-review-required: a security-boundary path (sandbox/, hooks, CI, scripts, agent capability
          # files, ...) is in this update. Do not merge without @security.
          labels: agentteams-autosync${{ steps.change.outputs.sensitive == 'true' && ',security-review-required' || '' }}

      # F-5: a detected change that opens or updates no PR is a silent failure (for example, Actions not allowed to
      # create pull requests). Fail the run so it shows red instead of passing as a quiet week.
      - name: Fail when a detected change produced no PR
        if: steps.cpr.outputs.pull-request-number == ''
        env:
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          NEW_SHA: ${{ steps.change.outputs.new_sha }}
        run: |
          if [ "$OPERATION" = none ]; then
            # Nothing to commit (for example a force=true run with no new content): not a failure.
            echo "::warning::autosync ran for $NEW_SHA but the working tree had no diff, so no PR was needed."
            exit 0
          fi
          echo "::error::autosync detected a change ($NEW_SHA) but no pull request was opened or updated (operation: '$OPERATION'). Check Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
          exit 1
