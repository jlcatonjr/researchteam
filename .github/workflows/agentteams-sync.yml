name: AgentTeams Sync (Dry Run First)

on:
  workflow_dispatch:
    inputs:
      agentteams_ref:
        description: "Optional AgentTeams ref (tag/branch/sha)"
        required: false
        default: ""
      dry_run:
        description: "Run without creating a sync PR"
        required: false
        type: boolean
        default: true
      open_pr:
        description: "Open or update PR when diff exists"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-agentteams:
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.diff.outputs.has_diff }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve execution mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "open_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "open_pr=${{ inputs.open_pr }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight forbidden-path guard
        run: |
          set -euo pipefail
          if [[ -d ".github/agents/.github" ]]; then
            echo "ERROR: Forbidden nested mirror path exists: .github/agents/.github"
            exit 1
          fi

      - name: Run AgentTeams update merge
        run: |
          set -euo pipefail
          echo "AgentTeams sync start" > agentteams-update.log
          echo "event=${{ github.event_name }} dry_run=${{ steps.mode.outputs.dry_run }}" >> agentteams-update.log

          if command -v agentteams >/dev/null 2>&1; then
            agentteams --description brief.json --update --merge --yes 2>&1 | tee -a agentteams-update.log
          elif [[ -f "build_team.py" ]]; then
            python build_team.py --description brief.json --update --merge --yes 2>&1 | tee -a agentteams-update.log
          else
            echo "Neither agentteams CLI nor build_team.py was found." | tee -a agentteams-update.log
            exit 1
          fi

      - name: Post-run forbidden-path guard
        run: |
          set -euo pipefail
          if [[ -d ".github/agents/.github" ]]; then
            echo "ERROR: Forbidden nested mirror path was reintroduced: .github/agents/.github"
            exit 1
          fi

      - name: Validate changed paths and fences
        run: |
          bash scripts/validate_agentteams_update.sh

      - name: Capture diff list
        id: diff
        run: |
          set -euo pipefail
          git status --porcelain > changed-files.txt
          if [[ -s changed-files.txt ]]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentteams-sync-artifacts
          path: |
            agentteams-update.log
            changed-files.txt

  open-pr:
    runs-on: ubuntu-latest
    needs: update-agentteams
    if: ${{ needs.update-agentteams.outputs.has_diff == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.open_pr == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/agentteams-sync-${{ github.run_id }}
          title: "chore: AgentTeams sync update"
          commit-message: "chore: apply agentteams --update --merge"
          body: |
            Automated AgentTeams sync.

            Checklist:
            - [ ] Changed files are within approved scope
            - [ ] No fence-integrity violations
            - [ ] No unresolved manual placeholders introduced
            - [ ] Reviewer sign-off completed
