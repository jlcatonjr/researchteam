name: Deploy Docs

# Builds the MkDocs site (mkdocs.yml, docs_src/) and deploys it to GitHub Pages at
# https://jlcatonjr.github.io/researchteam/ — the same pipeline agentteams uses for its docs. Pull requests
# only build (strict), so a broken link or nav entry fails before merge. Actions are pinned by commit and the
# build dependencies are hash-locked (.github/ci/requirements-docs.txt), as in tests.yml (S-10).
#
# One-time operator step: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ["mkdocs.yml", "docs_src/**", ".github/ci/requirements-docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install MkDocs dependencies (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r .github/ci/requirements-docs.txt

      - name: Build docs (strict)
        run: python -m mkdocs build --strict --site-dir _site

      - name: Mark Pages artifact as static (no Jekyll)
        run: touch _site/.nojekyll

      - name: Validate Pages artifact contents
        run: |
          test -s _site/index.html
          test -s _site/api-reference/index.html
          test -s _site/cli-reference/index.html
          test -f _site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    # Only main deploys: a workflow_dispatch from another branch builds but never publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
