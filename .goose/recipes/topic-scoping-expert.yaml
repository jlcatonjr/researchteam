  ## Delegation & references (Goose)

  Goose forbids nested delegation, so when you need another specialist's guidance, load that recipe into your own context with the `summon` `load` tool (do not try to spawn a sub-agent):

  - **Vet Brief Before Drafting** — call `load("adversarial")` to bring `adversarial`'s instructions into context, then act on them here.
  - **Send to Primary Producer** — call `load("primary-producer")` to bring `primary-producer`'s instructions into context, then act on them here.
  - **Verify Citations** — call `load("reference-manager")` to bring `reference-manager`'s instructions into context, then act on them here.
  - **Return to Orchestrator** — call `load("orchestrator")` to bring `orchestrator`'s instructions into context, then act on them here.
